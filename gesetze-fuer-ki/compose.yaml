# gesetze-fuer-ki.de: the MCP server for German federal and state law, and its documentation site
# (https://github.com/Marceltov/Gesetze-fuer-KI). A second product on this server, independent of notefeed: no database,
# no secrets. It clones the public data repositories (bundesrecht, plus landesrecht-<land> for each mirrored state) into
# ./data, pulls them every hour and keeps its search index next to them; all of ./data can be deleted and is rebuilt on the next start (~1 minute).
# Listens on the server's private address only, like notefeed: the Caddy on gewerbe-1 passes requests on over the private
# network (MarcelBruckner-Business/stacks, caddy/).
services:
  gesetze-fuer-ki:
    image: ghcr.io/gesetze-fuer-ki/gesetze-fuer-ki:0.2.6
    container_name: gesetze-fuer-ki
    # Monitored by Uptime Kuma (AutoKuma on this server reads these labels) as a visitor reaches it, at its public address
    # (PUBLIC_URL in .env), through DNS and the Caddy on gewerbe-1. The keyword is false until the index is built, so a
    # server that runs but cannot search shows as down.
    labels:
      kuma.gesetze.keyword.name: gesetze-fuer-ki
      kuma.gesetze.keyword.url: ${PUBLIC_URL}/health
      kuma.gesetze.keyword.keyword: '"ready":true'
      kuma.gesetze.keyword.parent_name: host-group
    restart: unless-stopped
    # No ALLOWED_HOSTS: the check against DNS rebinding protects servers on localhost; this one is public, holds public
    # data and no session worth taking, and the check would turn Uptime Kuma's direct request away.
    volumes:
      - ./data:/data
    ports:
      - "${PRIVATE_IP:?this server's address on the private network}:8081:8081"
